name: Public experience pilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B tests/test_public.py
